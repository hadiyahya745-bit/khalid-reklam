<title>خالد موسارەشی رێکلام | Xalid Mosarashi Reklam</title>
<style>
:root{--o:#ff6a00;--o2:#ff9440;--red:#7a1414;--bg:#090505;--card:rgba(255,255,255,.045);--bd:rgba(255,200,190,.12);--tx:#f4f4f5;--mu:#a1a1aa;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 5%;background:rgba(14,5,5,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.mark{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--o),#ff4d00);display:grid;place-items:center;color:#000;font-weight:900;font-size:1.3rem;overflow:hidden}
.mark img,.lg img{width:100%;height:100%;object-fit:cover;display:block}
.ctrl{display:flex;gap:6px}
.ctrl button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.82rem;font-family:inherit;transition:.2s}
.ctrl button:hover{border-color:var(--o)}
.ctrl button.on{background:var(--o);color:#000;border-color:var(--o);font-weight:700}
.hero{background:radial-gradient(circle at 50% 38%,#6e1515 0%,#3a0a0a 38%,#120505 75%);position:relative;min-height:92vh;display:grid;place-items:center;text-align:center;padding:70px 6%;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(var(--bd) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--bd) 1px,transparent 1px) 0 0/48px 48px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%);animation:grid 20s linear infinite}
.glow{position:absolute;z-index:-1;border-radius:50%;filter:blur(90px);background:var(--o);opacity:.28;animation:float 10s ease-in-out infinite}
.g1{width:380px;height:380px;top:-80px;left:-80px}.g2{width:340px;height:340px;bottom:-60px;right:-60px;animation-delay:-5s;opacity:.45;background:#c0201f}
.lg{width:min(220px,55vw);height:min(220px,55vw);margin:0 auto 22px;border-radius:28px;background:linear-gradient(135deg,var(--o),#ff4d00);display:grid;place-items:center;font-size:3.6rem;font-weight:900;color:#000;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:bob 4s ease-in-out infinite}
.badge{display:inline-block;border:1px solid var(--bd);background:var(--card);padding:5px 16px;border-radius:999px;font-size:.85rem;color:var(--o2);margin-bottom:16px}
h1{font-size:clamp(2.2rem,7vw,4.6rem);font-weight:900;line-height:1.2}
h1 span{background:linear-gradient(90deg,var(--o),var(--o2),var(--o));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
.hero p{color:var(--mu);font-size:1.12rem;max-width:620px;margin:14px auto 28px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--o),#ff4d00);color:#000;font-weight:800;padding:14px 32px;border-radius:999px;border:0;cursor:pointer;font-size:1rem;font-family:inherit;transition:.25s;margin:5px}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,106,0,.45)}
.btn.alt{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--bd)}
.btn.alt:hover{border-color:var(--o);box-shadow:none}
.mq{border-block:1px solid var(--bd);overflow:hidden;background:#1a0707;direction:ltr}
.mq div{display:flex;gap:44px;width:max-content;padding:14px 0;animation:mq 28s linear infinite;color:var(--o);font-weight:700;white-space:nowrap}
section{padding:90px 6%;max-width:1150px;margin:auto}
h2{font-size:clamp(1.7rem,4vw,2.4rem);text-align:center;margin-bottom:8px}
.sub{text-align:center;color:var(--mu);margin-bottom:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:30px 20px;position:relative;overflow:hidden;transition:.35s}
.card::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--o),var(--o2));transform:scaleX(0);transition:.4s}
.card:hover{transform:translateY(-8px);border-color:rgba(255,106,0,.6);background:rgba(122,20,20,.28)}
.card:hover::after{transform:scaleX(1)}
.card i{font-style:normal;font-size:2.4rem;display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:rgba(122,20,20,.55);margin-bottom:14px;transition:.4s}
.card:hover i{transform:rotate(-8deg) scale(1.1)}
.card h3{font-size:1.08rem}
.card small{color:var(--mu);position:absolute;top:14px;inset-inline-end:18px;font-weight:800;opacity:.4;font-size:1.3rem}
.steps .card{text-align:center}
.steps b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--o);color:#000;margin:0 auto 12px;font-size:1.2rem}
.steps p{color:var(--mu);font-size:.95rem}
form{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:30px;max-width:620px;margin:auto;display:grid;gap:14px}
input,select,textarea{width:100%;background:rgba(0,0,0,.45);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px;font-size:1rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--o);border-color:transparent}
select option{background:#1a0707}
form .btn{width:100%;margin:0}
.soc{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}
.soc a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:30px 12px;font-weight:800;font-size:1.05rem;transition:.35s}
.soc a b{display:grid;place-items:center;width:92px;height:92px;border-radius:26px;font-size:3rem;font-weight:400;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:.4s}
.soc a:hover{transform:translateY(-8px);border-color:var(--o);background:rgba(122,20,20,.3)}
.soc a:hover b{transform:scale(1.12) rotate(-6deg)}
footer{text-align:center;padding:34px 6% 90px;background:#120505;border-top:1px solid var(--bd);color:var(--mu);font-size:.9rem}
footer a{color:var(--o);font-weight:700}
.wa{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:20px;z-index:40;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:1.7rem;box-shadow:0 8px 24px rgba(37,211,102,.45);animation:ring 2.2s infinite}
.rv{opacity:0;transform:translateY(36px);transition:.8s}
.rv.show{opacity:1;transform:none}
@keyframes float{50%{transform:translate(30px,40px)}}
@keyframes shine{to{background-position:200%}}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes grid{to{background-position:48px 48px}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes ring{70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}

/* ===== red / white / orange / black + glass ===== */
:root{--o:#ff6a00;--o2:#ffa040;--red:#e11d27;--bg:#0a0a0a;--card:rgba(255,255,255,.1);--bd:rgba(255,255,255,.28)}
body{background:#0a0a0a}
header{background:rgba(10,10,10,.55);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.18)}
.mark{background:#fff;box-shadow:0 0 0 3px var(--red)}
.ctrl button{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff}
.ctrl button.on{background:#fff;color:var(--red);border-color:#fff}
.hero{background:radial-gradient(circle at 25% 15%,#ff3b30 0%,#d01020 32%,#6a0710 62%,#120203 100%)}
.glow.g1{background:var(--o);opacity:.55}
.glow.g2{background:#fff;opacity:.18}
.hero::before{background:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px) 0 0/48px 48px}
.gs{position:absolute;z-index:-1;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6);animation:gfl 9s ease-in-out infinite}
.gs1{width:190px;height:190px;border-radius:50%;top:10%;right:9%}
.gs2{width:150px;height:150px;border-radius:28px;bottom:12%;left:7%;transform:rotate(45deg);animation-delay:-3s}
.gs3{width:240px;height:84px;border-radius:999px;top:62%;right:14%;animation-delay:-5s;background:linear-gradient(135deg,rgba(255,106,0,.55),rgba(255,255,255,.08))}
.gs4{width:90px;height:90px;border-radius:50%;top:20%;left:12%;animation-delay:-7s;background:linear-gradient(135deg,rgba(0,0,0,.5),rgba(255,255,255,.1))}
@keyframes gfl{50%{translate:0 -26px;rotate:8deg}}
.lg{background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.25)}
.badge{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;border-color:rgba(255,255,255,.4)}
h1 span{background:linear-gradient(90deg,#fff,#ffb36b,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text}
.hero p{color:#ffe6e0}
.btn.alt{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.5)}
.mq{background:#fff;border-color:#fff}
.mq div{color:var(--red)}
section{position:relative}
h2::after{content:"";display:block;width:80px;height:5px;margin:10px auto 0;border-radius:5px;background:linear-gradient(90deg,var(--red),var(--o))}
#services,.steps,#order{isolation:isolate}
#services::before,#order::before{content:"";position:absolute;z-index:-1;width:360px;height:360px;border-radius:50%;filter:blur(90px);opacity:.55;background:var(--red);top:10%;left:-6%}
#services::after,#order::after{content:"";position:absolute;z-index:-1;width:300px;height:300px;border-radius:50%;filter:blur(90px);opacity:.45;background:var(--o);bottom:6%;right:-4%}
.card,form,.soc a{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 10px 36px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.card:hover{background:linear-gradient(135deg,rgba(225,29,39,.4),rgba(255,106,0,.18));border-color:rgba(255,255,255,.6)}
.card i{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.card::after{background:linear-gradient(90deg,var(--red),var(--o),#fff)}
.card small{color:#fff}
.steps b{background:linear-gradient(135deg,var(--red),var(--o));color:#fff}
.steps p{color:#e9dcdc}
input,select,textarea{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff}
input::placeholder,textarea::placeholder{color:#d8c4c4}
select option{background:#1a0707;color:#fff}
#contact{isolation:isolate}
#contact::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;translate:-50% 0;background:radial-gradient(circle at 12% 25%,rgba(255,106,0,.7),transparent 38%),radial-gradient(circle at 88% 75%,rgba(225,29,39,.65),transparent 40%),#fff}
#contact h2{color:#111}
#contact .sub{color:#444}
#contact .soc a{color:#111;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(120,10,10,.22),inset 0 1px 0 #fff}
#contact .soc a:hover{background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.6));border-color:var(--red)}
footer{background:#000;color:#cfcfcf;border-top:3px solid var(--red)}
footer a{color:var(--o)}
.wa{box-shadow:0 8px 24px rgba(37,211,102,.5)}

body,input,select,textarea,button{font-family:"Poppins","Vazirmatn","Noto Kufi Arabic",Tahoma,Arial,sans-serif}
h1,h2,h3,.logo,.btn,.badge,.ctrl button,.soc a,.mq div{font-family:"Poppins","Noto Kufi Arabic","Vazirmatn",Tahoma,Arial,sans-serif}
h1{font-weight:900;letter-spacing:-.5px;line-height:1.35}
h2{font-weight:800}
body{line-height:1.9;font-weight:400}

.qrbox{max-width:330px;margin:auto;text-align:center;padding:26px;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4);transition:.35s}
.qrbox:hover{transform:translateY(-6px);border-color:var(--o)}
.qrimg{background:#fff;border-radius:18px;padding:12px;box-shadow:0 0 0 5px var(--red),0 0 0 9px rgba(255,255,255,.25)}
.qrimg svg{display:block;width:100%;height:auto}
.qrname{margin-top:16px;font-weight:800;color:var(--o2)}
#qr{isolation:isolate}
#qr::before{content:"";position:absolute;z-index:-1;width:320px;height:320px;border-radius:50%;filter:blur(90px);opacity:.5;background:var(--red);top:20%;left:50%;translate:-50% 0}

/* ===== responsive: phone / tablet / laptop / large screens ===== */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img,svg,video{max-width:100%}
.hero{min-height:92vh;min-height:92svh}
@media (min-width:1400px){section{max-width:1300px}h1{font-size:5rem}.grid{gap:26px}.lg{width:250px;height:250px}.hero p{font-size:1.3rem;max-width:760px}}

section{padding:56px 5%}
.sub{margin-bottom:30px;font-size:.95rem}

form{padding:20px;border-radius:22px}
.gs1{width:110px;height:110px;top:3%;right:-24px}.gs2{width:90px;height:90px;bottom:3%;left:-14px}.gs3{display:none}.gs4{width:56px;height:56px;top:6%;left:5%}
.glow{filter:blur(70px)}.g1{width:260px;height:260px}.g2{width:240px;height:240px}

}
@media (max-width:360px){.grid:not(.steps):not(.soc){grid-template-columns:1fr}h2{font-size:1.5rem}.ctrl button{padding:5px 9px}}

#services::before,#order::before{left:0}

@supports (overflow:clip){#services,#order,#qr{overflow-x:clip}}

/* ===== animated full-width backgrounds: services + order ===== */
@supports (overflow:clip){body{overflow-x:clip}#services,#order{overflow-x:visible}}
#services,#order{isolation:isolate}
#services::before,#order::before,#services::after,#order::after{content:"";position:absolute;z-index:-2;top:0;bottom:0;left:50%;right:auto;width:100vw;height:auto;translate:-50% 0;border-radius:0;filter:none;opacity:1}
#services::before{background:linear-gradient(125deg,#0a0a0a,#3d050b,#9b0d19,#2a0508,#0a0a0a,#5c0710);background-size:320% 320%;animation:flow 16s ease-in-out infinite}
#order::before{background:linear-gradient(125deg,#b3000f,#e11d27,#ff6a00,#e11d27,#7a0610,#ff6a00);background-size:320% 320%;animation:flow 12s ease-in-out infinite}
#services::after,#order::after{z-index:-1;background:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/46px 46px,linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/46px 46px,radial-gradient(circle at 20% 30%,rgba(255,106,0,.35),transparent 35%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.14),transparent 30%);animation:gridmove 18s linear infinite,pulsebg 7s ease-in-out infinite;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.fx{position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;translate:-50% 0;overflow:hidden;pointer-events:none}
.fx i{position:absolute;bottom:-140px;display:block;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5);animation:rise linear infinite}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes gridmove{to{background-position:46px 46px,46px 46px,0 0,0 0}}
@keyframes pulsebg{50%{opacity:.6}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateY(-120vh) rotate(200deg);opacity:0}}
@media (max-width:768px){.fx i:nth-child(n+6){display:none}}
@media (prefers-reduced-motion:reduce){.fx i{animation:none;opacity:.5;bottom:20%}}

.card i{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#e11d27,#ff6a00);border:1px solid rgba(255,255,255,.45);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5);color:#fff;margin-bottom:16px}
